services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas
    ports: ["5432:5432"]
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:latest
    container_name: atlas-kafka
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    container_name: atlas-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/atlas_dev_password
    ports: ["7474:7474", "7687:7687"]
    volumes: ["atlas_neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: atlas-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:latest
    container_name: atlas-grafana
    restart: unless-stopped
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: atlas_dev_password
    volumes: ["atlas_grafana_data:/var/lib/grafana"]
    depends_on: [prometheus]

  ollama:
    image: ollama/ollama:latest
    container_name: atlas-ollama
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: ["atlas_ollama_data:/root/.ollama"]
    profiles: ["ollama"]
  parser-service:
    build:
      context: ./ai-services/parser-service
      dockerfile: Dockerfile
    container_name: atlas-parser-service
    restart: unless-stopped
    ports: ["50051:50051"]

  embedding-service:
    build:
      context: ./ai-services/embedding-service
      dockerfile: Dockerfile
    container_name: atlas-embedding-service
    restart: unless-stopped
    ports: ["50052:50052"]

  rag-service:
    build:
      context: ./ai-services/rag-service
      dockerfile: Dockerfile
    container_name: atlas-rag-service
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      SEARCH_SERVICE_URL: http://search-service:8086
      GRAPH_SERVICE_URL: http://graph-service:8085
    depends_on: [search-service, graph-service]

  reasoning-service:
    build:
      context: ./ai-services/reasoning-service
      dockerfile: Dockerfile
    container_name: atlas-reasoning-service
    restart: unless-stopped
    ports: ["8001:8001"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}

  # ---------- Java backend services ----------
  auth-service:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: auth-service, SERVICE_PORT: 8081 } }
    container_name: atlas-auth-service
    restart: unless-stopped
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas?currentSchema=auth
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      postgres: { condition: service_healthy }

  project-service:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: project-service, SERVICE_PORT: 8082 } }
    container_name: atlas-project-service
    restart: unless-stopped
    ports: ["8082:8082"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas?currentSchema=project
    depends_on:
      postgres: { condition: service_healthy }

  ingestion-service:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: ingestion-service, SERVICE_PORT: 8083 } }
    container_name: atlas-ingestion-service
    restart: unless-stopped
    ports: ["8083:8083"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas?currentSchema=ingestion
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICES_PROJECT_SERVICE_URL: http://project-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      project-service: { condition: service_started }

  knowledge-service:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: knowledge-service, SERVICE_PORT: 8084 } }
    container_name: atlas-knowledge-service
    restart: unless-stopped
    ports: ["8084:8084"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas?currentSchema=knowledge
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  graph-service:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: graph-service, SERVICE_PORT: 8085 } }
    container_name: atlas-graph-service
    restart: unless-stopped
    ports: ["8085:8085"]
    environment:
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: atlas_dev_password
    depends_on:
      neo4j: { condition: service_healthy }

  search-service:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: search-service, SERVICE_PORT: 8086 } }
    container_name: atlas-search-service
    restart: unless-stopped
    ports: ["8086:8086"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas?currentSchema=search
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_CLIENT_EMBEDDING_SERVICE_ADDRESS: static://embedding-service:50052
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      embedding-service: { condition: service_started }

  analysis-service:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: analysis-service, SERVICE_PORT: 8087 } }
    container_name: atlas-analysis-service
    restart: unless-stopped
    ports: ["8087:8087"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas?currentSchema=analysis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICES_GRAPH_SERVICE_URL: http://graph-service:8085
      SERVICES_REASONING_SERVICE_URL: http://reasoning-service:8001
      SERVICES_PROJECT_SERVICE_URL: http://project-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      graph-service: { condition: service_started }
      reasoning-service: { condition: service_started }

  ai-gateway:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: ai-gateway, SERVICE_PORT: 8090 } }
    container_name: atlas-ai-gateway
    restart: unless-stopped
    ports: ["8090:8090"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_CLIENT_PARSER_SERVICE_ADDRESS: static://parser-service:50051
      SERVICES_GRAPH_SERVICE_URL: http://graph-service:8085
      SERVICES_SEARCH_SERVICE_URL: http://search-service:8086
      SERVICES_RAG_SERVICE_URL: http://rag-service:8000
      SERVICES_REASONING_SERVICE_URL: http://reasoning-service:8001
    depends_on:
      kafka: { condition: service_healthy }
      parser-service: { condition: service_started }
      graph-service: { condition: service_started }
      search-service: { condition: service_started }

  integration-service:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: integration-service, SERVICE_PORT: 8091 } }
    container_name: atlas-integration-service
    restart: unless-stopped
    ports: ["8091:8091"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICES_PROJECT_SERVICE_URL: http://project-service:8082
      SERVICES_INGESTION_SERVICE_URL: http://ingestion-service:8083
      INTEGRATION_GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      INTEGRATION_JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      INTEGRATION_JIRA_EMAIL: ${JIRA_EMAIL:-}
      INTEGRATION_JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      INTEGRATION_JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
    depends_on:
      kafka: { condition: service_healthy }

  scheduler-service:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: scheduler-service, SERVICE_PORT: 8092 } }
    container_name: atlas-scheduler-service
    restart: unless-stopped
    ports: ["8092:8092"]
    environment:
      SERVICES_PROJECT_SERVICE_URL: http://project-service:8082
      SERVICES_INGESTION_SERVICE_URL: http://ingestion-service:8083
    depends_on:
      project-service: { condition: service_started }

  api-gateway:
    build: { context: ., dockerfile: backend/Dockerfile.service, args: { SERVICE_DIR: api-gateway, SERVICE_PORT: 8080 } }
    container_name: atlas-api-gateway
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://project-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://search-service:8086
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://graph-service:8085
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://analysis-service:8087
      SPRING_CLOUD_GATEWAY_ROUTES_5_URI: http://ai-gateway:8090
      SPRING_CLOUD_GATEWAY_ROUTES_6_URI: http://ingestion-service:8083
    depends_on:
      auth-service: { condition: service_started }
      project-service: { condition: service_started }

  # ---------- Frontend ----------
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: http://localhost:8080 }
    container_name: atlas-frontend
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on:
      api-gateway: { condition: service_started }

networks:
  default:
    name: atlas-network

volumes:
  atlas_postgres_data:
  atlas_neo4j_data:
  atlas_grafana_data:
  atlas_ollama_data:
    external: true
    name: ollama