spring.application.name=knowledge-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/atlas?currentSchema=knowledge
spring.datasource.username=atlas
spring.datasource.password=atlas_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=knowledge
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.schemas=knowledge
spring.flyway.default-schema=knowledge
spring.flyway.baseline-on-migrate=true

spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true