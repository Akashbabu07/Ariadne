spring.application.name=project-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/atlas?currentSchema=project
spring.datasource.username=atlas
spring.datasource.password=atlas_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=project
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.schemas=project
spring.flyway.default-schema=project
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
