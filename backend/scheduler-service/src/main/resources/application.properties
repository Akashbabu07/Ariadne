spring.application.name=scheduler-service
server.port=8092

services.project-service.url=http://${SERVICES_PROJECT_SERVICE_HOST:localhost}:${SERVICES_PROJECT_SERVICE_PORT:8082}
services.ingestion-service.url=http://${SERVICES_INGESTION_SERVICE_HOST:localhost}:${SERVICES_INGESTION_SERVICE_PORT:8083}

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true