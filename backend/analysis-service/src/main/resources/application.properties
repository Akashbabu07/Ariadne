spring.application.name=analysis-service
server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/atlas?currentSchema=analysis
spring.datasource.username=atlas
spring.datasource.password=atlas_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=analysis
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.schemas=analysis
spring.flyway.default-schema=analysis
spring.flyway.baseline-on-migrate=true

services.graph-service.url=http://localhost:8085

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true