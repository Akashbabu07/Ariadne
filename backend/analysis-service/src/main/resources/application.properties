spring.application.name=analysis-service
server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/atlas?currentSchema=analysis
spring.datasource.username=atlas
spring.datasource.password=atlas_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=analysis
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.schemas=analysis
spring.flyway.default-schema=analysis
spring.flyway.baseline-on-migrate=true


management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
services.graph-service.url=http://${SERVICES_GRAPH_SERVICE_HOST:localhost}:${SERVICES_GRAPH_SERVICE_PORT:8085}
services.reasoning-service.url=http://${SERVICES_REASONING_SERVICE_HOST:localhost}:${SERVICES_REASONING_SERVICE_PORT:8001}
services.project-service.url=http://${SERVICES_PROJECT_SERVICE_HOST:localhost}:${SERVICES_PROJECT_SERVICE_PORT:8082}
spring.kafka.bootstrap-servers=localhost:9092