spring.application.name=auth-service
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/atlas?currentSchema=auth
spring.datasource.username=atlas
spring.datasource.password=atlas_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=auth
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.flyway.baseline-on-migrate=true

# JWT
atlas.jwt.secret=${JWT_SECRET:dev-only-change-me-in-production-8f3a9c2e1b7d4f6a0c8e2b5d9f1a3c7e}
atlas.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
atlas.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Actuator
management.endpoints.web.exposure.include=health,info