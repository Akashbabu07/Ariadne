spring.application.name=search-service
server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/atlas?currentSchema=search
spring.datasource.username=atlas
spring.datasource.password=atlas_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=search
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.schemas=search
spring.flyway.default-schema=search
spring.flyway.baseline-on-migrate=true

spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
grpc.client.embedding-service.address=static://${GRPC_CLIENT_EMBEDDING_SERVICE_HOST:localhost}:${GRPC_CLIENT_EMBEDDING_SERVICE_PORT:50052}
grpc.client.embedding-service.negotiation-type=plaintext
