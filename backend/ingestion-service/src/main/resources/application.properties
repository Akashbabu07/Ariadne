spring.application.name=ingestion-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/atlas?currentSchema=ingestion
spring.datasource.username=atlas
spring.datasource.password=atlas_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=ingestion
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.schemas=ingestion
spring.flyway.default-schema=ingestion
spring.flyway.baseline-on-migrate=true

spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true

services.project-service.url=http://${SERVICES_PROJECT_SERVICE_HOST:localhost}:${SERVICES_PROJECT_SERVICE_PORT:8082}
