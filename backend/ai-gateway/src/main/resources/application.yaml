spring:
  application:
    name: ai-gateway
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8090

grpc:
  client:
    parser-service:
      address: static://${GRPC_CLIENT_PARSER_SERVICE_HOST:localhost}:${GRPC_CLIENT_PARSER_SERVICE_PORT:50051}
      negotiation-type: plaintext


services:
  graph-service:
    url: http://${SERVICES_GRAPH_SERVICE_HOST:localhost}:${SERVICES_GRAPH_SERVICE_PORT:8085}
  search-service:
    url: http://${SERVICES_SEARCH_SERVICE_HOST:localhost}:${SERVICES_SEARCH_SERVICE_PORT:8086}
  rag-service:
    url: http://${SERVICES_RAG_SERVICE_HOST:localhost}:${SERVICES_RAG_SERVICE_PORT:8000}
  reasoning-service:
    url: http://${SERVICES_REASONING_SERVICE_HOST:localhost}:${SERVICES_REASONING_SERVICE_PORT:8001}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  prometheus:
    metrics:
      export:
        enabled: true
