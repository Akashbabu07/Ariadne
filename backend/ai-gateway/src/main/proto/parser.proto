syntax = "proto3";

package Ariadne.parser;

option java_package = "com.Ariadne.grpc.parser";
option java_multiple_files = true;

service ParserService {
  rpc ParseRepository (ParseRequest) returns (ParseResponse);
}

message ParseRequest {
  string repository_id = 1;
  string git_url = 2;
}

message ParseResponse {
  string repository_id = 1;
  int32 files_parsed = 2;
  repeated ParsedFile files = 3;
}

message ParsedFile {
  string path = 1;
  string language = 2;
  int32 line_count = 3;
  repeated string imports = 4;
  string content = 5;
}
