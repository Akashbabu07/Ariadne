server.port=8080

spring.application.name=api-gateway

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=project-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/organizations/**,/api/v1/projects/**,/api/v1/repositories/**,/api/v1/members/**

Ariadne.jwt.secret=${JWT_SECRET:dev-only-change-me-in-production-8f3a9c2e1b7d4f6a0c8e2b5d9f1a3c7e}

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true